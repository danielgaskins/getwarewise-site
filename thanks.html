<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101712" />
    <meta name="robots" content="noindex" />
    <title>Message received | Warewise</title>
    <style>
      :root { color-scheme: light; font-family: Manrope, Arial, sans-serif; color: #101712; background: #f5f4ee; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 80% 10%, #dfffa0 0, transparent 32%), #f5f4ee; }
      main { width: min(680px, 100%); padding: clamp(32px, 7vw, 72px); border: 1px solid #cad0c7; border-radius: 28px; background: rgba(255,255,255,.78); box-shadow: 0 24px 80px rgba(16,23,18,.1); }
      .mark { display: inline-grid; place-items: center; width: 42px; height: 42px; margin-bottom: 42px; border-radius: 12px; background: #101712; color: #c7ff4a; font: 800 20px/1 monospace; }
      .eyebrow { margin: 0 0 14px; font: 700 12px/1.4 monospace; letter-spacing: .12em; text-transform: uppercase; color: #4c594f; }
      h1 { margin: 0; font-size: clamp(42px, 9vw, 76px); line-height: .96; letter-spacing: -.065em; }
      p { max-width: 500px; margin: 24px 0 34px; font-size: 18px; line-height: 1.65; color: #4c594f; }
      a { display: inline-flex; padding: 14px 20px; border-radius: 999px; background: #101712; color: #fff; font-weight: 750; text-decoration: none; }
      a:hover { background: #253128; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">W</div>
      <p class="eyebrow">Message received</p>
      <h1>We’ll take it<br />from here.</h1>
      <p>Thanks for reaching out. We’ll review what you shared and reply within one business day with a useful next step.</p>
      <a href="/">Back to Warewise</a>
    </main>
  </body>
</html>
